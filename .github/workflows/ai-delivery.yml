name: AI units build, tests and game previews
on:
  push:
    branches:
      - arena/267ca919-aiarsenal
permissions:
  contents: write
concurrency:
  group: ai-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true
jobs:
  build-test-capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      DISPLAY: ':99'
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      QA_PREFIX: ai-review
      QA_VOLUMETRIC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mods/aiarsenal/**/*.gradle*
            mods/aiarsenal/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install software display and image validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xdotool x11-utils pulseaudio libegl1 libgl1 libgl1-mesa-dri libopenal1 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 libflite1
          python -m pip install pillow
          Xvfb :99 -screen 0 1400x1000x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          python - <<'PY'
          import subprocess,time
          end=time.monotonic()+30
          while subprocess.run(['xdpyinfo','-display',':99'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode:
              if time.monotonic()>end: raise RuntimeError('Xvfb did not become ready')
              time.sleep(.2)
          PY
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=qa rate=48000
          pactl set-default-sink qa
          pactl set-default-source qa.monitor
      - name: Restore compressed baseline models
        run: python tools/restore_models.py
      - name: Regenerate soldier textures (reproducible)
        run: python tools/make_soldier_assets.py
      - name: Build distributable
        working-directory: mods/aiarsenal
        run: ./gradlew build --no-daemon
      - name: Run regression tests (full gametest suite + soldier tests)
        id: regression
        continue-on-error: true
        env:
          MC_RUNS: ${{ runner.temp }}/mc-tests
        run: python tools/verify_game.py gametest
      - name: Capture real Minecraft F2 images of the AI soldiers
        env:
          MC_RUNS: ${{ runner.temp }}/mc-runs
        run: |
          mkdir -p previews
          python tools/wwi/preview_soldiers.py 2>&1 | tee previews/preview-run.log
      - name: Publish only the captured preview images
        run: |
          mkdir -p previews/ai-units
          for name in soldiers-on-foot soldier-in-zu23 soldier-in-truck unit-eggs-in-hand unit-eggs-tab soldier-weapon-3p weapon-in-hand-3p weapon-first-person explosion-smoke explosion-smoke-late; do
            if [ -f "verification/shots/ai-review-${name}.png" ]; then
              cp "verification/shots/ai-review-${name}.png" "previews/ai-units/${name}.png"
            fi
          done
          for f in verification/shots/ai-review-weapon-variant-*.png; do
            [ -f "$f" ] || continue
            cp "$f" "previews/ai-units/$(basename "$f" | sed 's/^ai-review-//')"
          done
          ls -l previews/ai-units
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = sorted(Path('previews/ai-units').glob('*.png'))
          assert len(files) >= 7, f'expected at least 7 previews, got {len(files)}'
          for path in files:
              with Image.open(path) as image:
                  image.verify()
              print(f'{path}: {path.stat().st_size} bytes')
          PY
      - name: Record the verification result
        env:
          TEST_RESULT: ${{ steps.regression.outcome }}
        run: |
          printf 'Regression tests: %s\nSource: %s\nRun: %s/%s/actions/runs/%s\n' "$TEST_RESULT" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > previews/verification.txt
      - name: Upload JAR, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-units-build-${{ github.run_number }}
          path: |
            verification/shots/ai-review-*.png
            previews/ai-units/*.png
            verification/logs/*.log
            mods/aiarsenal/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30

      - name: Publish the JAR and screenshots as a GitHub release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="ai-units-${GITHUB_RUN_NUMBER}"
          rm -rf release-bundle && mkdir -p release-bundle
          jar=$(ls mods/aiarsenal/build/libs/*.jar 2>/dev/null | grep -v sources | head -1 || true)
          if [ -n "$jar" ]; then cp "$jar" release-bundle/; fi
          if [ -d previews/ai-units ]; then cp previews/ai-units/*.png release-bundle/ 2>/dev/null || true; fi
          if [ -f previews/verification.txt ]; then cp previews/verification.txt release-bundle/; fi
          ( cd release-bundle && sha256sum ./* > SHA256SUMS )
          ls -l release-bundle
          gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
            --title "AI units build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7})" \
            --notes "AI soldiers: Steve body + class uniform, one summon egg per class in the ai_units tab, boarding AI, weapon hand placement, volumetric smoke. Sources: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            release-bundle/* || gh release upload "$tag" release-bundle/* --clobber

      - name: Publish light previews on the ai-delivery branch
        if: always()
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Path('previews/ai-units')
          out = Path('delivery/ai-units')
          out.mkdir(parents=True, exist_ok=True)
          for path in sorted(src.glob('*.png')):
              with Image.open(path) as image:
                  light = image.convert('RGB')
              light.thumbnail((1100, 1100))
              target = out / (path.stem + '.jpg')
              light.save(target, quality=82, optimize=True)
              print(f'{target}: {target.stat().st_size} bytes')
          logs = Path('delivery/logs')
          logs.mkdir(parents=True, exist_ok=True)
          rcon = Path('verification/logs/rcon.log')
          preview = Path('previews/preview-run.log')
          if preview.exists():
              (logs / 'preview-run.txt').write_text(preview.read_text(encoding='utf-8', errors='replace')[-20000:])
          if rcon.exists():
              lines = rcon.read_text(encoding='utf-8', errors='replace').splitlines()
              (logs / 'rcon-tail.txt').write_text('\n'.join(lines[-400:]), encoding='utf-8')
          Path('delivery/README.txt').write_text(
              'Auto-generated previews of the AI soldiers in Minecraft, see the GitHub releases.\n',
              encoding='utf-8')
          PY
          git config user.name "ai-arsenal-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -B ai-delivery
          git add -f delivery
          git commit -q -m "previews for run ${GITHUB_RUN_NUMBER} [skip ci]" || echo "nothing to publish"
          git push -q -f origin ai-delivery
