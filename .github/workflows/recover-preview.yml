name: Recover captured game previews
on:
  push:
    branches: [arena/9b3be652-aiarsenal]
permissions:
  contents: write
  actions: write
jobs:
  recover:
    if: contains(github.event.head_commit.message, '[recover]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Recover actual F2 images from completed runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 39050246486 --repo "$GITHUB_REPOSITORY" --name wwi-gameplay-previews-4 --dir "$RUNNER_TEMP/recovered"
          mkdir -p previews/alpha13
          find "$RUNNER_TEMP/recovered" -type f -name 'public-preview-*.png' -exec cp {} previews/alpha13/ \;
          test -s previews/alpha13/public-preview-mark-i-exterior.png
          printf 'Alpha.13 F2 captures. Source b523f90. Build passed; regression failed due to inherited ambiguous Gewehr/Kar98k recipe.\n' > previews/alpha13/verification.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/
          git commit -m 'Publish captured alpha13 game previews for visual review'
          git pull --rebase origin arena/9b3be652-aiarsenal
          git push origin HEAD:arena/9b3be652-aiarsenal
  advance:
    if: contains(github.event.head_commit.message, '[advance]')
    runs-on: ubuntu-22.04
    steps:
      - name: Stop superseded builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run cancel 39052762832
  deliver:
    if: contains(github.event.head_commit.message, '[deliver]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Upload the tested alpha.16 build without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          grep -Fx 'Regression tests: success' previews/verification.txt
          grep -Fx 'Source: 321ef847753e5bdd8c819bd43bcf6d846c899d15' previews/verification.txt
          gh run download 39052885694 --name wwi-gameplay-previews-13 --dir recovered
          jar="$(find recovered -name 'aiarsenal-1.0.1-alpha.16.jar' -type f)"
          test -n "$jar" && test "$(printf '%s\n' "$jar" | wc -l)" -eq 1
          cp "$jar" aiarsenal-1.0.1-alpha.16.jar
          sha256sum aiarsenal-1.0.1-alpha.16.jar > SHA256SUMS
          gh release upload v1.0.1-alpha.16 aiarsenal-1.0.1-alpha.16.jar SHA256SUMS previews/*.png --clobber
