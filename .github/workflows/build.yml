name: Build mod jar

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jar:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mods/aiarsenal/**/*.gradle*
            mods/aiarsenal/gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore compressed baseline models
        run: python3 tools/restore_models.py

      - name: Build distributable
        id: build
        continue-on-error: true
        working-directory: mods/aiarsenal
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace --warning-mode=summary 2>&1 | tee build.log

      # A failed compile is reported back into the branch: the agent reads ci/build-failure.txt.
      - name: Report compile errors
        if: steps.build.outcome == 'failure'
        run: |
          set -uo pipefail
          mkdir -p ci
          {
            echo "# Gradle build failure"
            echo
            grep -nE -A3 "error:|FAILURE:|Execution failed|Caused by:|> Task .* FAILED" mods/aiarsenal/build.log | head -400
            echo
            echo "## Tail"
            tail -120 mods/aiarsenal/build.log
          } > ci/build-failure.txt || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/build-failure.txt
          git commit -m "ci: compile report [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
          exit 1

      - name: Build succeeded
        if: steps.build.outcome == 'success'
        run: rm -rf ci

      - name: Collect jar
        id: jar
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' mods/aiarsenal/gradle.properties | tr -d '\r')"
          jar="mods/aiarsenal/build/libs/aiarsenal-${version}.jar"
          ls -l mods/aiarsenal/build/libs || true
          test -f "$jar" || { echo "::error title=Jar missing::$jar was not produced"; exit 1; }
          sha256sum "$jar" > SHA256SUMS.txt
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          ls -l "$jar"
          cat SHA256SUMS.txt

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiarsenal-jar
          path: |
            mods/aiarsenal/build/libs/*.jar
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      # A published release is the reliable download path for the player.
      - name: Publish rolling build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' mods/aiarsenal/gradle.properties)"
          jar="mods/aiarsenal/build/libs/aiarsenal-${version}.jar"
          notes="Сборка из ветки ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA}. Minecraft 1.20.1, Forge 47.4.23, Java 17."
          gh release view "ci-latest" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "ci-latest" --repo "$GITHUB_REPOSITORY" --prerelease \
                 --target "$GITHUB_SHA" --title "AI Arsenal — свежая сборка" --notes "$notes"
          gh release upload "ci-latest" "$jar" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "ci-latest" --repo "$GITHUB_REPOSITORY" --notes "$notes"

      - name: Publish versioned release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' mods/aiarsenal/gradle.properties)"
          jar="mods/aiarsenal/build/libs/aiarsenal-${version}.jar"
          gh release view "v${version}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "v${version}" --repo "$GITHUB_REPOSITORY" --prerelease \
                 --target "$GITHUB_SHA" --title "AI Arsenal ${version}" \
                 --notes "Мод для Minecraft 1.20.1 и Forge 47.4.23: ИИ-солдаты трёх эпох, онлайн-совместимость, анимации оружия от третьего лица и совместимость с шейдерами (Photon/Iris)."
          gh release upload "v${version}" "$jar" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
