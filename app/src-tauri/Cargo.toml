[package]
name = "orakul"
version = "0.3.0-dev.0"
description = "Оракул — локальный ИИ для ПК и телефона. Офлайн, агентный интерфейс, уровни размышления."
authors = ["standimaoff-oss"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "orakul_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
